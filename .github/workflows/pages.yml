name: Publish notebook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'test.ipynb'
      - 'scripts/build_notebook_site.py'
      - 'requirements-pages.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - name: Install notebook renderer
        run: python -m pip install -r requirements-pages.txt
      - name: Render notebook homepage
        run: python scripts/build_notebook_site.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy notebook
        id: deployment
        uses: actions/deploy-pages@v4
